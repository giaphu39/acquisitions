name: CI first pipeline

on:
  push: 
   branches: [ main ]
  
jobs: 
 build: 
  runs-on: ubuntu-latest
  
 steps:
   - name: Checkout Code
     uses: actions/checkout@v4
   - name: Set up Node.js
     uses: actions/setup-node@v3
     with: 
      node-version: '16'  
      cache: 'npm'
   - name: Install dependencies
     run: npm install
   - name: Run Tests
     run: npm test
   - name: Run app
     run: npm start